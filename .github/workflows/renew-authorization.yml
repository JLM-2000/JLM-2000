name: Renew iFlySEO authorization

# Signs a fresh short-lived authorization every day. Stop this workflow (or run
# the revoke path) and every plugin stops on its own once the last token
# expires. The signing key lives only in this repo's secrets and on the
# operator's offline backup — never on the product's servers.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      revoke:
        description: "Set to 'yes' to revoke instead of renew"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: renew-authorization
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign the authorization
        env:
          IFLYSEO_AUTH_PRIVATE_KEY: ${{ secrets.IFLYSEO_AUTH_PRIVATE_KEY }}
          REVOKE: ${{ github.event.inputs.revoke }}
        run: |
          php -r '
            $pair = base64_decode(trim(getenv("IFLYSEO_AUTH_PRIVATE_KEY")));
            if ($pair === false || strlen($pair) !== SODIUM_CRYPTO_SIGN_KEYPAIRBYTES) {
                fwrite(STDERR, "Clave privada ausente o inválida.\n"); exit(1);
            }
            $secret = sodium_crypto_sign_secretkey($pair);
            $revoke = trim((string) getenv("REVOKE")) === "yes";
            $inner = [
                "authorized_until" => time() + ($revoke ? 0 : 3 * 86400),
                "issued_at" => time(),
                "revoked" => $revoke,
            ];
            $payload = base64_encode(json_encode($inner, JSON_UNESCAPED_SLASHES));
            $sig = base64_encode(sodium_crypto_sign_detached($payload, $secret));
            file_put_contents(
                "service-authorization/authorization.json",
                json_encode(["payload" => $payload, "signature" => $sig], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n"
            );
            fwrite(STDERR, ($revoke ? "Revocado" : "Renovado hasta " . date("Y-m-d H:i", $inner["authorized_until"])) . "\n");
          '
      - name: Commit if changed
        run: |
          git config user.name "iflyseo-authorization-bot"
          git config user.email "actions@users.noreply.github.com"
          git add service-authorization/authorization.json
          git diff --cached --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "Renew service authorization ($(date -u +%Y-%m-%d))"
          git push
